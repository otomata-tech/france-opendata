name: CI

# Le job `test` execute la suite de tests du depot.
#
# Il ne l'executait pas. Jusqu'au 09/09/2026 il se contentait d'un
# `python -c "import france_opendata"`, sur la foi d'un commentaire disant que le
# depot n'avait pas de tests. C'etait vrai a la redaction, plus depuis longtemps :
# `tests/` contenait 22 fichiers qui n'avaient jamais tourne une seule fois, et le
# job affichait vert sous le nom `test`. Un controle vert qui n'a rien controle
# vaut moins que pas de controle — meme mode d'echec que le CLA repare le meme
# jour (voir .github/workflows/cla.yml).
#
# Le smoke d'import reste, en plus : il attrape un client mort a l'install, avant
# meme la collecte des tests. La lib est publiee sur PyPI et consommee en prod.
# Actions epinglees par SHA (supply-chain). Cf. otomata-private#39 (#5 + #6).
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # Les extras sont necessaires a la SUITE, pas a la lib : les tests du
        # stock SIRENE importent duckdb, ceux de la provenance DILA defusedxml.
        # Sans eux, la collecte casse au lieu de tester.
        run: pip install ".[stock,sante]" pytest
      - name: Smoke (import du package)
        run: python -c "import france_opendata; print('OK', france_opendata.__name__)"
      - name: Tests
        # Une suite vide fait sortir pytest en code 5, donc ROUGIR ce job : si
        # plus rien n'est collecte un jour, on doit le voir, pas passer au vert.
        run: pytest -q --strict-markers
